version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "type: dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Batch non-breaking Rust bumps into one PR. Major bumps stay
      # ungrouped so each breaking change gets its own reviewable PR.
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "type: dependencies"
      - "area: ci"
    commit-message:
      prefix: "ci"
    groups:
      # codeql-action/init and codeql-action/analyze must run the same version:
      # analyze rejects a config file written by a different init version. Split
      # across two PRs, each one fails on its own and only passes once both land.
      # Listed first and matching all update types so the pair always travels
      # together, even on a major bump that actions-minor-patch would not catch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Batch non-breaking action bumps. Major bumps stay ungrouped so a
      # breaking change (e.g. setup-node v6 -> v7) gets its own PR.
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm dependencies (root package)
  - package-ecosystem: "npm"
    directory: "/"
    # The Agent SDK is tracked by the Agent SDK Update Monitor workflow
    # (issue-based), so exclude it here to avoid duplicate PRs.
    ignore:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "type: dependencies"
      - "area: agent-sdk"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm dependencies (agent-sdk bridge)
  - package-ecosystem: "npm"
    directory: "/agent-sdk"
    # The Agent SDK is tracked by the Agent SDK Update Monitor workflow
    # (issue-based), so exclude it here to avoid duplicate PRs.
    ignore:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "type: dependencies"
      - "area: agent-sdk"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
