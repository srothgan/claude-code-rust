name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require main branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release publishing is only allowed from refs/heads/main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Read crate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid Cargo.toml package version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Determine whether a release is needed
        id: gate
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::notice::Crate version matches existing tag $TAG; nothing to release. Skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag $TAG is new; proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require new npm versions
        if: steps.gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          check_recoverable() {
            local package_name="$1"
            local output
            local status
            set +e
            output=$(npm view "${package_name}@${VERSION}" version --json 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "NOTICE: ${package_name}@${VERSION} already exists; its publish job will skip it"
              return
            fi
            if ! printf '%s\n' "$output" | grep -q 'E404'; then
              echo "::error::Could not verify npm package state for ${package_name}@${VERSION}"
              echo "$output"
              exit 1
            fi
            echo "OK: ${package_name}@${VERSION} is not published"
          }

          check_recoverable "claude-code-rust"
          check_recoverable "@srothgan/claude-code-rust-darwin-arm64"
          check_recoverable "@srothgan/claude-code-rust-darwin-x64"
          check_recoverable "@srothgan/claude-code-rust-linux-arm64-gnu"
          check_recoverable "@srothgan/claude-code-rust-linux-x64-gnu"
          check_recoverable "@srothgan/claude-code-rust-win32-arm64-msvc"
          check_recoverable "@srothgan/claude-code-rust-win32-x64-msvc"

      - name: Validate Bun runtime manifest
        if: steps.gate.outputs.should_release == 'true'
        run: node scripts/runtime/stage-bun-runtime.mjs --check --verify-upstream

  agent-sdk-preflight:
    needs: [verify]
    if: needs.verify.outputs.should_release == 'true'
    uses: ./.github/workflows/_agent-sdk.yml
    permissions:
      contents: read

  build-binaries:
    needs: [verify, agent-sdk-preflight]
    name: Build ${{ matrix.target }}
    uses: ./.github/workflows/_release-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_dir: linux-x64-gnu
            exe: claude-rs
            asset: claude-code-rust-x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_dir: linux-arm64-gnu
            exe: claude-rs
            asset: claude-code-rust-aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package_dir: win32-x64-msvc
            exe: claude-rs.exe
            asset: claude-code-rust-x86_64-pc-windows-msvc.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            package_dir: win32-arm64-msvc
            exe: claude-rs.exe
            asset: claude-code-rust-aarch64-pc-windows-msvc.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package_dir: darwin-x64
            exe: claude-rs
            asset: claude-code-rust-x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
            package_dir: darwin-arm64
            exe: claude-rs
            asset: claude-code-rust-aarch64-apple-darwin
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      package_dir: ${{ matrix.package_dir }}
      exe: ${{ matrix.exe }}
      asset: ${{ matrix.asset }}
      version: ${{ needs.verify.outputs.version }}
      artifact_prefix: release-binary
      attest: true

  stage-bun-runtimes:
    needs: [verify]
    if: needs.verify.outputs.should_release == 'true'
    name: Stage bundled Bun runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download, verify, and stage Bun runtimes
        run: node scripts/runtime/stage-bun-runtime.mjs --download

      - name: Upload staged Bun runtimes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundled-bun-runtimes
          path: dist-platform/*/bin/claude-rs-bridge-bun*
          if-no-files-found: error

  assemble-npm-packages:
    needs: [verify, agent-sdk-preflight, build-binaries, stage-bun-runtimes]
    name: Assemble release package set
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-sdk/package-lock.json

      - name: Download staged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-binary-*
          merge-multiple: true
          path: .

      - name: Download staged Bun runtimes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bundled-bun-runtimes
          path: dist-platform

      - name: Restore executable bits for downloaded Unix artifacts
        run: |
          set -euo pipefail
          find dist-platform -type f \( -name 'claude-rs' -o -name 'claude-rs-bridge-bun' \) -exec chmod 755 {} +

      - name: Install root dependencies
        run: npm ci

      - name: Install agent-sdk dependencies
        run: npm ci --prefix agent-sdk

      - name: Build agent-sdk bridge
        run: npm --prefix agent-sdk run build

      - name: Verify staged Bun runtimes
        run: |
          node scripts/runtime/stage-bun-runtime.mjs --check
          node scripts/runtime/verify-staged-bun-runtimes.mjs

      - name: Assemble npm package directories
        run: node scripts/npm/generate-npm-packages.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Verify npm package layout
        run: node scripts/npm/verify-npm-packages.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Generate install archives
        run: node scripts/install/generate-install-archives.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Verify install archives
        run: node scripts/install/verify-install-archives.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Pack npm tarballs
        run: |
          set -euo pipefail
          mkdir -p dist-pack
          npm pack ./dist-npm/darwin-arm64 --pack-destination ./dist-pack --json
          npm pack ./dist-npm/darwin-x64 --pack-destination ./dist-pack --json
          npm pack ./dist-npm/linux-arm64-gnu --pack-destination ./dist-pack --json
          npm pack ./dist-npm/linux-x64-gnu --pack-destination ./dist-pack --json
          npm pack ./dist-npm/win32-arm64-msvc --pack-destination ./dist-pack --json
          npm pack ./dist-npm/win32-x64-msvc --pack-destination ./dist-pack --json
          npm pack ./dist-npm/root --pack-destination ./dist-pack --json

      - name: Generate release bundle
        run: node scripts/release/generate-release-bundle.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Verify release bundle
        run: node scripts/release/verify-release-bundle.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          mapfile -t public_assets < <(find dist-install -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          public_assets+=("claude-code-rust-${VERSION}-release-bundle.tar.gz")
          sha256sum "${public_assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest public release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            dist-install/*.tar.gz
            dist-install/*.zip
            claude-code-rust-${{ needs.verify.outputs.version }}-release-bundle.tar.gz
            SHA256SUMS

      - name: Upload release package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: |
            dist-assets/
            dist-npm/manifests/
            dist-pack/
            dist-install/
            claude-code-rust-${{ needs.verify.outputs.version }}-release-bundle.tar.gz
            release-manifest.json
            SHA256SUMS
            SHA256SUMS.internal
          if-no-files-found: error

  smoke-test-packages:
    needs: [verify, assemble-npm-packages]
    name: Smoke ${{ matrix.package_dir }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            package_dir: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            package_dir: linux-arm64-gnu
          - runner: windows-latest
            package_dir: win32-x64-msvc
          - runner: windows-11-arm
            package_dir: win32-arm64-msvc
          - runner: macos-15-intel
            package_dir: darwin-x64
          - runner: macos-15
            package_dir: darwin-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Install root runtime dependencies for registry smoke
        run: npm ci --omit=dev --ignore-scripts

      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Smoke-test installed npm tarballs
        run: node scripts/npm/smoke-npm-package-install.mjs --platform "${{ matrix.package_dir }}" --use-existing-tarballs --real-binary --no-system-runtime

      - name: Smoke-test global npm install from temp registry
        run: node scripts/npm/smoke-npm-package-install.mjs --platform "${{ matrix.package_dir }}" --use-existing-tarballs --registry-smoke --real-binary --no-system-runtime

      - name: Smoke-test install archive
        run: node scripts/install/smoke-install-archive.mjs --platform "${{ matrix.package_dir }}" --real-binary --no-system-runtime

  verify-release-attestations:
    needs: [verify, smoke-test-packages]
    name: Verify release attestations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Verify build provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer_workflow="srothgan/claude-code-rust/.github/workflows/_release-build.yml@refs/heads/main"
          gh attestation verify dist-assets/claude-code-rust-x86_64-unknown-linux-gnu \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify dist-assets/claude-code-rust-aarch64-unknown-linux-gnu \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify dist-assets/claude-code-rust-x86_64-pc-windows-msvc.exe \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify dist-assets/claude-code-rust-aarch64-pc-windows-msvc.exe \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify dist-assets/claude-code-rust-x86_64-apple-darwin \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify dist-assets/claude-code-rust-aarch64-apple-darwin \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners

      - name: Verify public release asset attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer_workflow="srothgan/claude-code-rust/.github/workflows/release.yml@refs/heads/main"
          VERSION="${{ needs.verify.outputs.version }}"
          for subject in \
            dist-install/*.tar.gz \
            dist-install/*.zip \
            "claude-code-rust-${VERSION}-release-bundle.tar.gz" \
            SHA256SUMS
          do
            gh attestation verify "$subject" \
              --repo srothgan/claude-code-rust \
              --signer-workflow "$signer_workflow" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done

  publish-platform-packages:
    needs: [verify, verify-release-attestations]
    name: Publish platform npm packages
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Dry-run npm tarball publish
        run: node scripts/npm/dry-run-npm-publish.mjs --pack-dir dist-pack --version "${{ needs.verify.outputs.version }}"

      - name: Publish platform tarballs
        run: node scripts/npm/publish-npm-platform-packages.mjs --pack-dir dist-pack --ledger-dir dist-publish-ledger --version "${{ needs.verify.outputs.version }}"

      - name: Upload platform publish ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-platform-publish-ledger-${{ needs.verify.outputs.version }}
          path: dist-publish-ledger/
          if-no-files-found: error

  publish-root-package:
    needs: [verify, publish-platform-packages]
    name: Publish root npm package
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Publish root tarball
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          package_name="claude-code-rust"
          tarball="./dist-pack/claude-code-rust-${{ needs.verify.outputs.version }}.tgz"
          if [ ! -f "$tarball" ]; then
            echo "::error::Missing npm package tarball: $tarball"
            exit 1
          fi

          set +e
          output="$(npm view "${package_name}@${VERSION}" version --json 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "SKIP: ${package_name}@${VERSION} already published"
            exit 0
          fi
          if ! printf '%s\n' "$output" | grep -q 'E404'; then
            echo "::error::Could not inspect npm package state for ${package_name}@${VERSION}"
            echo "$output"
            exit 1
          fi

          npm publish "$tarball" --access public

  create-github-release:
    needs: [verify, publish-root-package]
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Create release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          awk '/^## \['"$VERSION"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            {
              echo "Release ${{ needs.verify.outputs.tag }}"
              echo
              echo "Automated npm platform-package release for claude-code-rust $VERSION."
            } > release-notes.md
          fi
          {
            echo
            echo "Bundled runtime provenance:"
            echo
            echo "- npm platform packages include private Bun runtime files."
            echo "- Bun source asset names, source archive SHA256 checksums, runtime SHA256 checksums, and source URLs are recorded in dist-npm/manifests/*.json."
            echo "- Install archives, install manifests, and release bundle metadata are recorded in dist-install/manifests/*.json and release-manifest.json."
          } >> release-notes.md

      - name: Create annotated tag
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          VERSION="${{ needs.verify.outputs.version }}"
          mapfile -t release_assets < <(find dist-install -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          release_assets+=("claude-code-rust-${VERSION}-release-bundle.tar.gz")
          release_assets+=(SHA256SUMS)
          gh release create "$TAG" "${release_assets[@]}" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md

  publish-github-release:
    needs: [verify, create-github-release]
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
    steps:
      - name: Publish draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.verify.outputs.tag }}" --draft=false --repo srothgan/claude-code-rust
