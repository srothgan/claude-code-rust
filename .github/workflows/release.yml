name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require main branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release publishing is only allowed from refs/heads/main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Read crate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid Cargo.toml package version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Require new git tag
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: $TAG"
            exit 1
          fi

      - name: Require new npm versions
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          check_absent() {
            local package_name="$1"
            local output
            local status
            set +e
            output=$(npm view "${package_name}@${VERSION}" version --json 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "::error::npm package version already exists: ${package_name}@${VERSION}"
              echo "$output"
              exit 1
            fi
            if ! printf '%s\n' "$output" | grep -q 'E404'; then
              echo "::error::Could not verify npm package absence for ${package_name}@${VERSION}"
              echo "$output"
              exit 1
            fi
            echo "OK: ${package_name}@${VERSION} is not published"
          }

          check_absent "claude-code-rust"
          check_absent "@srothgan/claude-code-rust-darwin-arm64"
          check_absent "@srothgan/claude-code-rust-darwin-x64"
          check_absent "@srothgan/claude-code-rust-linux-x64-gnu"
          check_absent "@srothgan/claude-code-rust-win32-x64-msvc"

  agent-sdk-preflight:
    needs: [verify]
    uses: ./.github/workflows/_agent-sdk.yml
    permissions:
      contents: read

  build-binaries:
    needs: [verify, agent-sdk-preflight]
    name: Build ${{ matrix.target }}
    uses: ./.github/workflows/_release-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_dir: linux-x64-gnu
            exe: claude-rs
            asset: claude-code-rust-x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package_dir: win32-x64-msvc
            exe: claude-rs.exe
            asset: claude-code-rust-x86_64-pc-windows-msvc.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package_dir: darwin-x64
            exe: claude-rs
            asset: claude-code-rust-x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
            package_dir: darwin-arm64
            exe: claude-rs
            asset: claude-code-rust-aarch64-apple-darwin
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      package_dir: ${{ matrix.package_dir }}
      exe: ${{ matrix.exe }}
      asset: ${{ matrix.asset }}
      version: ${{ needs.verify.outputs.version }}
      artifact_prefix: release-binary
      attest: true

  assemble-npm-packages:
    needs: [verify, agent-sdk-preflight, build-binaries]
    name: Assemble npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-sdk/package-lock.json

      - name: Download staged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-binary-*
          merge-multiple: true
          path: .

      - name: Install root dependencies
        run: npm ci

      - name: Install agent-sdk dependencies
        run: npm ci --prefix agent-sdk

      - name: Build agent-sdk bridge
        run: npm --prefix agent-sdk run build

      - name: Assemble npm package directories
        run: node scripts/generate-npm-packages.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Verify npm package layout
        run: node scripts/verify-npm-packages.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Pack npm tarballs
        run: |
          set -euo pipefail
          mkdir -p dist-pack
          npm pack ./dist-npm/darwin-arm64 --pack-destination ./dist-pack --json
          npm pack ./dist-npm/darwin-x64 --pack-destination ./dist-pack --json
          npm pack ./dist-npm/linux-x64-gnu --pack-destination ./dist-pack --json
          npm pack ./dist-npm/win32-x64-msvc --pack-destination ./dist-pack --json
          npm pack ./dist-npm/root --pack-destination ./dist-pack --json

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          find dist-assets dist-pack dist-npm/manifests -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: |
            dist-assets/*
            dist-npm/manifests/*.json
            dist-pack/*.tgz
            SHA256SUMS
          if-no-files-found: error

  smoke-test-packages:
    needs: [verify, assemble-npm-packages]
    name: Smoke ${{ matrix.package_dir }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            package_dir: linux-x64-gnu
          - runner: windows-latest
            package_dir: win32-x64-msvc
          - runner: macos-15-intel
            package_dir: darwin-x64
          - runner: macos-15
            package_dir: darwin-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Smoke-test installed npm tarballs
        run: node scripts/smoke-npm-package-install.mjs --platform "${{ matrix.package_dir }}" --use-existing-tarballs --real-binary

  create-github-release:
    needs: [verify, smoke-test-packages]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Create release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          awk '/^## \['"$VERSION"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            {
              echo "Release ${{ needs.verify.outputs.tag }}"
              echo
              echo "Automated npm platform-package release for claude-code-rust $VERSION."
            } > release-notes.md
          fi

      - name: Create annotated tag
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          mapfile -t release_assets < <(find dist-assets dist-pack dist-npm/manifests -type f | sort)
          release_assets+=(SHA256SUMS)
          gh release create "$TAG" "${release_assets[@]}" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md

  verify-release-attestations:
    needs: [verify, create-github-release]
    name: Verify binary attestations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Verify build provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer_workflow="srothgan/claude-code-rust/.github/workflows/release.yml@refs/heads/main"
          gh attestation verify dist-assets/claude-code-rust-x86_64-unknown-linux-gnu \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify dist-assets/claude-code-rust-x86_64-pc-windows-msvc.exe \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify dist-assets/claude-code-rust-x86_64-apple-darwin \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify dist-assets/claude-code-rust-aarch64-apple-darwin \
            --repo srothgan/claude-code-rust \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners

  publish-platform-packages:
    needs: [verify, verify-release-attestations]
    name: Publish platform npm packages
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Publish platform tarballs
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          publish_package() {
            local package_name="$1"
            local filename="${package_name#@}"
            filename="${filename/\//-}-${VERSION}.tgz"
            local tarball="./dist-pack/$filename"
            if [ ! -f "$tarball" ]; then
              echo "::error::Missing npm package tarball: $tarball"
              exit 1
            fi
            npm publish "$tarball" --access public
          }
          publish_package "@srothgan/claude-code-rust-darwin-arm64"
          publish_package "@srothgan/claude-code-rust-darwin-x64"
          publish_package "@srothgan/claude-code-rust-linux-x64-gnu"
          publish_package "@srothgan/claude-code-rust-win32-x64-msvc"

  publish-root-package:
    needs: [verify, publish-platform-packages]
    name: Publish root npm package
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-set-${{ needs.verify.outputs.version }}
          path: .

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Publish root tarball
        run: |
          set -euo pipefail
          tarball="./dist-pack/claude-code-rust-${{ needs.verify.outputs.version }}.tgz"
          if [ ! -f "$tarball" ]; then
            echo "::error::Missing npm package tarball: $tarball"
            exit 1
          fi
          npm publish "$tarball" --access public
