name: Release Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "bin/**"
      - "agent-sdk/**"
      - "scripts/generate-npm-packages.mjs"
      - "scripts/npm-package-config.mjs"
      - "scripts/smoke-npm-package-install.mjs"
      - "scripts/verify-npm-packages.mjs"
      - ".github/workflows/agent-sdk.yml"
      - ".github/workflows/release-dryrun.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Get crate version
        id: get_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release candidate version: $VERSION"

  agent-sdk-preflight:
    needs: [verify]
    uses: ./.github/workflows/agent-sdk.yml
    permissions:
      contents: read

  build-binaries:
    needs: [verify]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_dir: linux-x64-gnu
            exe: claude-rs
            asset: claude-code-rust-x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package_dir: win32-x64-msvc
            exe: claude-rs.exe
            asset: claude-code-rust-x86_64-pc-windows-msvc.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package_dir: darwin-x64
            exe: claude-rs
            asset: claude-code-rust-x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
            package_dir: darwin-arm64
            exe: claude-rs
            asset: claude-code-rust-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin claude-rs

      - name: Stage release candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          mkdir -p "dist-assets" "dist-platform/${{ matrix.package_dir }}/bin"
          cp "$binary" "dist-assets/${{ matrix.asset }}"
          cp "$binary" "dist-platform/${{ matrix.package_dir }}/bin/${{ matrix.exe }}"
          chmod +x "dist-assets/${{ matrix.asset }}" "dist-platform/${{ matrix.package_dir }}/bin/${{ matrix.exe }}" 2>/dev/null || true
          {
            echo "git_sha=${{ github.sha }}"
            echo "version=${{ needs.verify.outputs.version }}"
            echo "rust_target=${{ matrix.target }}"
            echo "runner_os=${{ runner.os }}"
            echo "asset=${{ matrix.asset }}"
            echo "package_dir=${{ matrix.package_dir }}"
            echo "rustc_version<<EOF"
            rustc -Vv
            echo "EOF"
          } > "dist-assets/${{ matrix.asset }}.build-metadata.txt"

      - name: Upload staged release candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ matrix.package_dir }}
          path: |
            dist-assets/*
            dist-platform/${{ matrix.package_dir }}/bin/*
          if-no-files-found: error

  assemble-npm-packages:
    needs: [verify, agent-sdk-preflight, build-binaries]
    name: Assemble, verify, and smoke-test npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-sdk/package-lock.json

      - name: Download staged binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-candidate-*
          merge-multiple: true
          path: .

      - name: Install root dependencies
        run: npm ci

      - name: Install agent-sdk dependencies
        run: npm ci --prefix agent-sdk

      - name: Build agent-sdk bridge
        run: npm --prefix agent-sdk run build

      - name: Assemble npm packages
        run: node scripts/generate-npm-packages.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Verify npm package layout
        run: node scripts/verify-npm-packages.mjs --version "${{ needs.verify.outputs.version }}"

      - name: Pack and smoke-test npm install
        run: node scripts/smoke-npm-package-install.mjs --real-binary

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          find dist-assets dist-pack -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release candidate artifact set
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ needs.verify.outputs.version }}
          path: |
            dist-assets/*
            dist-npm/manifests/*.json
            dist-pack/*.tgz
            SHA256SUMS
          if-no-files-found: error
