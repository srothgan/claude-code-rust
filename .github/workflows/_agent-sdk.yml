name: Agent SDK

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check agent-sdk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: agent-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # agent-sdk is an npm workspace; the root lockfile owns its dependencies.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build bridge
        run: npm run build

      - name: Run tests
        run: node --test 'dist/**/*.test.js'

      - name: Run lint
        run: npm run lint

      - name: Run Knip
        run: npm run knip

      - name: Run raw audit report
        run: npm run audit:raw
        continue-on-error: true

      - name: Run direct dependency audit gate
        run: npm run audit
