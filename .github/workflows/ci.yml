name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  unsafe-code:
    name: Unsafe Code Warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo rustc` applies `-W unsafe-code` only to the selected project target,
      # avoiding dependency noise from low-level terminal/platform crates.
      - name: Warn on unsafe in library target
        continue-on-error: true
        run: cargo rustc --lib --all-features -- -W unsafe-code
      - name: Warn on unsafe in binary target
        continue-on-error: true
        run: cargo rustc --bin claude-rs --all-features -- -W unsafe-code

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check --all-features

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check lockfile
        run: cargo fetch --locked

  direct-binary-smoke:
    name: Direct Binary Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --bin claude-rs
      - name: Smoke-test version startup (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/claude-rs --version
      - name: Smoke-test help startup (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/claude-rs --help
      - name: Smoke-test version startup (Windows)
        if: runner.os == 'Windows'
        run: .\target\release\claude-rs.exe --version
      - name: Smoke-test help startup (Windows)
        if: runner.os == 'Windows'
        run: .\target\release\claude-rs.exe --help

  npm-package-layout:
    name: npm Package Layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-sdk/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install agent-sdk dependencies
        run: npm ci --prefix agent-sdk

      - name: Build agent-sdk bridge
        run: npm --prefix agent-sdk run build

      - name: Generate mock npm packages
        run: node scripts/generate-npm-packages.mjs --mock-binaries

      - name: Verify npm package layout
        run: node scripts/verify-npm-packages.mjs

      - name: Smoke-test packed npm install
        run: node scripts/smoke-npm-package-install.mjs

      - name: Upload package layout artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-layout
          path: |
            dist-npm/manifests/*.json
            dist-pack/*.tgz
          if-no-files-found: warn
