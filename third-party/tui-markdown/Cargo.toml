# Vendored from crates.io tui-markdown 0.3.13 (upstream 9c4fcaa6888ba32f03ce3a54fd21991e820b3c7f).
# Local patches: retain list-paragraph indentation and accept resolved Markdown events.
# Remove this override after an upstream release supports both changes.
[package]
edition = "2021"
rust-version = "1.88.0"
name = "tui-markdown"
version = "0.3.13"
authors = ["Joshka"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A simple library for converting markdown to a Ratatui Text value"
documentation = "https://docs.rs/tui-markdown"
keywords = [
    "cli",
    "markdown",
    "ratatui",
    "terminal",
    "tui",
]
categories = ["command-line-interface"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/tui-markdown"

[package.metadata.docs.rs]
all-features = true
cargo-args = [
    "-Zunstable-options",
    "-Zrustdoc-scrape-examples",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = ["highlight-code"]
highlight-code = [
    "dep:syntect",
    "dep:ansi-to-tui",
]

[lib]
name = "tui_markdown"
path = "src/lib.rs"

[dependencies.ansi-to-tui]
version = "8"
optional = true

[dependencies.document-features]
version = "0.2.11"
optional = true

[dependencies.itertools]
version = "0.15"

[dependencies.pulldown-cmark]
version = "0.13.5"

[dependencies.ratatui-core]
version = "0.1"
default-features = false

[dependencies.syntect]
version = "5"
features = ["default-syntaxes", "default-themes", "plist-load", "regex-onig"]
optional = true
default-features = false

[dependencies.tracing]
version = "0.1.37"

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.insta]
version = "1"

[dev-dependencies.pretty_assertions]
version = "1"

[dev-dependencies.ratatui]
version = "0.30"
default-features = false

[dev-dependencies.rstest]
version = "0.27"

[dev-dependencies.tracing-subscriber]
version = "0.3"
